# Marathon settings
host = "127.0.0.1"
port = 8080

[database]
host = "127.0.0.1" # PostgreSQL-Serveradresse
port = 5433 # PostgreSQL-Port
name = "marathon" # Datenbankname
user = "marathon" # Datenbanknutzer

[engine]
tick_interval_s = 0.5   # Takt der Engine in Sekunden (0.05–10)
poll_timeout_s = 25     # So lange hält der Server die Anfrage eines Workers offen (1–60)
worker_timeout_s = 30   # Ohne Meldung gilt ein Worker danach als ausgefallen (10–600)
pickup_timeout_s = 10   # Abhol-Frist für zugeteilte Jobs (1–600)
max_attempts = 3        # Unterbrochene Versuche je Asset und Modul (1–10)

[folder_dialog]
server_address = ""     # Standard für die Server-Adresse im Ordner-Dialog (Rechnername oder IP, z. B. 10.0.77.11); danach gilt der Wert aus der Oberfläche

[server_worker]
enabled = true                                      # Server-Worker mit dem Server starten
skills = ["copy_file", "move_file", "rename_file"]  # Fähigkeiten ab Werk, oben = höchste Prio; danach gilt die Worker-Seite

[proxy]
public_url = "https://laptop-martin-r"  # Adresse, unter der Marathon erreichbar ist (nur https://, ohne Pfad); Startwert, danach gilt der Wert aus der Oberfläche
builtin = true                          # Mitgelieferten Proxy (Caddy) starten; false = externer Reverse-Proxy
trusted_proxies = []                    # IP-Adressen externer Reverse-Proxys; bei builtin = true gilt 127.0.0.1 automatisch

[auth]
admin_emails = []      # Break-Glass-Admins: immer Admin, in der Oberfläche nicht herabstufbar oder löschbar
allowed_domains = []   # Startwert für erlaubte E-Mail-Domains der Selbstregistrierung (exakt, Subdomains einzeln); danach gilt der Wert aus der Oberfläche
session_days = 180     # Gültigkeit einer Anmeldung in Tagen, verlängert sich bei Nutzung (1–365)
code_ttl_minutes = 15  # Gültigkeit des Anmeldecodes in Minuten (1–60)

# Startwert beim ersten Start; danach Einstellungen → Mailversand (Datenbank)
[smtp]
host = ""              # SMTP-Server; leer = Mailversand nicht eingerichtet
port = 587             # Port (1–65535)
username = ""          # Anmeldename; leer = ohne Anmeldung. Passwort nur per MARATHON_SMTP_PASSWORD oder .data/smtp.pass
use_tls = true         # STARTTLS verwenden
from_address = ""      # Absenderadresse, z. B. marathon@looks.film
from_name = "Marathon" # Anzeigename des Absenders
