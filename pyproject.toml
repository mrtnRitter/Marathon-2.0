[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marathon-2"
version = "0.1.0"
description = "Prototype workflow server for Marathon 2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
include = ["m2*"]

[tool.setuptools.package-data]
"m2.server" = ["static/*", "static/.*"]
